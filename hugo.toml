baseURL = "https://www.smhtpz.com/"
languageCode = "en-us"
title = "Semih Topuz"
theme = "PaperMod"
enableRobotsTXT = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1


[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "publications"
    name = "Publications"
    url = "/publications/"
    weight = 20

[params]
    description = "Semih Topuz — PhD candidate in Educational Measurement and Evaluation, researching AI, psychometrics, and data-driven assessment."
    author = "Semih Topuz"
    images = ["images/og-image.png"]
    defaultTheme = "dark"
    ShowShareButtons = false

    # Site verification codes (Google Search Console, Bing Webmaster Tools).
    # Paste only the "content" value of the verification meta tag.
    [params.analytics.google]
        SiteVerificationTag = ""
    [params.analytics.bing]
        SiteVerificationTag = ""

    # Cloudflare Web Analytics beacon token. Leave empty if analytics is
    # enabled from the Cloudflare Pages dashboard instead.
    [params.cloudflareAnalytics]
        token = ""

    # schema.org Person data for the home page (layouts/partials/templates/schema_json.html).
    [params.schema]
        jobTitle = "Research Assistant"
        worksFor = "Başkent University"
        alumniOf = "Hacettepe University"
        knowsAbout = ["Educational Measurement and Evaluation", "Psychometrics", "Artificial Intelligence", "Machine Learning", "Computerized Adaptive Testing", "Large Language Models"]

    [params.logo]
        light = "images/logo-light.png"
        dark = "images/logo-dark.png"
        alt = "smhtpz logo"

    [params.profileMode]
        enabled = true
        title = "Semih Topuz"
        subtitle = "PhD Candidate in Educational Measurement and Evaluation | Researcher focusing on AI, Psychometrics, and Data-Driven Assessment"
        
        [[params.profileMode.buttons]]
            name = "Publications"
            url = "/publications"

        [[params.profileMode.buttons]]
            name = "About"
            url = "/about"

[[params.socialIcons]]
    name = "github"
    url = "https://github.com/smhtpz"
[[params.socialIcons]]
    name = "googlescholar"
    url = "https://scholar.google.com/citations?user=MjAhoTkAAAAJ&hl"
[[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/smhtpz"