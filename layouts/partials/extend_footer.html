{{- /* Cloudflare Web Analytics: rendered only in production when a token is set in hugo.toml. */ -}}
{{- with site.Params.cloudflareAnalytics.token }}
{{- if hugo.IsProduction }}
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ . }}"}'></script>
{{- end }}
{{- end }}
